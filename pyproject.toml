[project]
name = "echelon-zwift-fastapi"
version = "0.3.0"
description = "Echelon Connect Sport ride monitor for Windows and Linux, with Zwift broadcasting on Linux"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.txt"]
dependencies = [
  "bleak==2.1.1",
  "bless==0.3.0; sys_platform == 'linux'",
  "dbus-next==0.2.3; sys_platform == 'linux'",
  "fastapi>=0.115,<1",
  "python-dotenv>=1,<2",
  "uvicorn>=0.54,<1",
  "wsproto>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28,<1"]

[project.scripts]
echelon-bridge = "echelon_bridge.__main__:main"
echelon-mirror-setup = "echelon_bridge.phone_setup:main"

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/echelon_bridge"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# An explicit source allowlist keeps local configuration, captures, installed
# dependencies, and machine-specific notes out of release source archives.
include = [
  "/backend/echelon_bridge", "/backend/tests", "/desktop", "/scripts",
  "/frontend/src", "/frontend/scripts", "/frontend/tests",
  "/frontend/public/favicon.svg", "/frontend/index.html",
  "/frontend/package.json", "/frontend/package-lock.json", "/frontend/vite.config.js",
  "/bridge", "/Start Echelon Bridge.bat", "/Stop Echelon Bridge.bat", "/hatch_build.py", "/pyproject.toml", "/uv.lock",
  "/.gitignore", "/.env.example", "/README.md", "/SMOKE_TEST.md",
  "/VALIDATION.md", "/SECURITY.md", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.txt",
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo", "**/*.local.md", "**/*.jsonl", "**/*.[pP][sS][vV]", "**/phone.json", "**/*-phone.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
