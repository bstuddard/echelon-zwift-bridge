[project]
name = "echelon-zwift-fastapi"
version = "0.3.0"
description = "Local Echelon Connect Sport to Zwift BLE bridge with FastAPI diagnostics"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.txt"]
dependencies = [
  "bleak==2.1.1",
  "bless==0.3.0",
  "dbus-next==0.2.3",
  "fastapi>=0.115,<1",
  "python-dotenv>=1,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28,<1"]

[project.scripts]
echelon-bridge = "echelon_bridge.__main__:main"

[tool.uv]
# Linux is the supported runtime. Bless's Windows requirements conflict with
# Bleak's current WinRT dependencies; they must not constrain the Linux lock.
environments = ["sys_platform == 'linux'"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/echelon_bridge"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# An explicit source allowlist keeps local configuration, captures, installed
# dependencies, and machine-specific notes out of release source archives.
include = [
  "/backend/echelon_bridge", "/backend/tests", "/desktop", "/scripts",
  "/frontend/src", "/frontend/scripts", "/frontend/tests",
  "/frontend/public/favicon.svg", "/frontend/index.html",
  "/frontend/package.json", "/frontend/package-lock.json", "/frontend/vite.config.js",
  "/bridge", "/hatch_build.py", "/pyproject.toml", "/uv.lock",
  "/.gitignore", "/.env.example", "/README.md", "/SMOKE_TEST.md",
  "/VALIDATION.md", "/SECURITY.md", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.txt",
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo", "**/*.local.md", "**/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
