name: Windows ride monitor

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reader:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install uv==0.13.5
      - run: uv sync --python 3.14 --frozen --extra dev
      - name: Load the native Bluetooth backends
        run: uv run --frozen python -c "from bleak.backends.winrt.client import BleakClientWinRT; from bleak.backends.winrt.scanner import BleakScannerWinRT"
      - run: npm.cmd --prefix frontend ci
      - run: npm.cmd --prefix frontend run build
      - run: npm.cmd --prefix frontend test
      - run: uv run --frozen --extra dev pytest -q
      - run: uv run --frozen --extra dev python scripts/test_session_ui.py
      - name: Open the compiled dashboard on a native Windows server
        shell: pwsh
        run: |
          $server = Start-Process .venv/Scripts/python.exe -ArgumentList '-m','echelon_bridge','--http-only','--port','8765' -PassThru -NoNewWindow
          try {
            $health = Invoke-RestMethod http://127.0.0.1:8765/api/health -MaximumRetryCount 12 -RetryIntervalSec 1
            if ($health.host_platform -ne 'windows' -or $health.ble_power_advertising_enabled) { throw 'Unexpected Windows capabilities' }
            $page = Invoke-WebRequest http://127.0.0.1:8765/
            if ($page.Content -notmatch '/assets/index-') { throw 'Missing production dashboard' }
            node frontend/tests/pedal-browser.mjs http://127.0.0.1:8765
            if ($LASTEXITCODE -ne 0) { throw 'Pedal reminder browser checks failed' }
          } finally {
            if (!$server.HasExited) { $server.Kill(); $server.WaitForExit() }
          }
